<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проектирование интеллектуальных систем управления</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#14212b;--mu:#566574;--ac:#0f766e;--ac2:#dff1ee;--bd:#d3dae1;--bl:#2f6fd0;--wa:#c2410c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--card:#161e26;--tx:#e5ebf0;--mu:#97a5b3;--ac:#2fb5a8;--ac2:#18302d;--bd:#28333f;--bl:#6aa6ff;--wa:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;--card:#161e26;--tx:#e5ebf0;--mu:#97a5b3;--ac:#2fb5a8;--ac2:#18302d;--bd:#28333f;--bl:#6aa6ff;--wa:#fb923c;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
h1{font-size:15px;margin:0 0 8px;font-weight:650}
nav{display:flex;gap:6px;overflow-x:auto}
nav a{flex:none;min-width:34px;text-align:center;padding:4px 10px;border:1px solid var(--bd);border-radius:8px;color:var(--mu);text-decoration:none;font-size:13px}
nav a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:880px;margin:0 auto;padding:16px 14px 40px}
h2{font-size:22px;margin:8px 0 4px;line-height:1.25}
h3{font-size:15px;margin:0 0 8px}
.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
a.card{display:block;text-decoration:none;color:inherit;margin:0}
a.card:hover{border-color:var(--ac)}
a.card b{color:var(--ac)}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer;text-decoration:none}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
canvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;background:var(--card);display:block}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--ac2)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto;font-size:12px;max-height:260px;margin:8px 0 0}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
input[type=range]{width:170px;padding:0}
label{font-size:13px;color:var(--mu)}
label b{color:var(--tx)}
ul,ol{margin:4px 0;padding-left:20px}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
</style>
</head>
<body>
<header><h1>Проектирование интеллектуальных систем управления</h1><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cv=(id,w,h)=>{const c=$('#'+id);c.width=w;c.height=h;return c.getContext('2d')};
const rnd=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const pl=(x,p,c,w=2)=>{x.strokeStyle=c;x.lineWidth=w;x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.stroke()};
const dot=(x,a,b,c,r=3)=>{x.fillStyle=c;x.beginPath();x.arc(a,b,r,0,7);x.fill()};
const sl=(id,l,a,b,s,v)=>`<label>${l}: <b id="${id}v">${v}</b><br><input type="range" id="${id}" min="${a}" max="${b}" step="${s}" value="${v}"></label>`;
const bind=(ids,f)=>{ids.forEach(i=>$('#'+i).oninput=()=>{$('#'+i+'v').textContent=$('#'+i).value;f()});f()};
let TM=[];const ev=(f,ms)=>TM.push(setInterval(f,ms));const stop=()=>{TM.forEach(clearInterval);TM=[]};

/* ---------- общий мир: сетка 30×16, 1 ячейка = 5 м ---------- */
const GW=30,GH=16,CS=20;
const blk=Array.from({length:GH},()=>Array(GW).fill(0));
[[8,2,2,9],[15,7,2,8],[21,1,2,8],[4,11,5,2]].forEach(([x,y,w,h])=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)blk[j][i]=1});
const world=x=>{x.fillStyle=col('--mu');blk.forEach((r,j)=>r.forEach((v,i)=>v&&x.fillRect(i*CS,j*CS,CS,CS)))};
function astar(s,g){const open=[[0,s[0],s[1]]],came={},gs={[s]:0},h=(x,y)=>Math.hypot(x-g[0],y-g[1]);
 while(open.length){open.sort((a,b)=>a[0]-b[0]);const[,x,y]=open.shift();
  if(x==g[0]&&y==g[1]){const p=[[x,y]];let k=x+','+y;while(came[k]){p.push(came[k]);k=came[k][0]+','+came[k][1]}return p.reverse()}
  for(let dx=-1;dx<2;dx++)for(let dy=-1;dy<2;dy++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;
   if(nx<0||ny<0||nx>=GW||ny>=GH||blk[ny][nx])continue;if(dx&&dy&&(blk[y][nx]||blk[ny][x]))continue;
   const c=gs[x+','+y]+Math.hypot(dx,dy),k=nx+','+ny;if(gs[k]===undefined||c<gs[k]){gs[k]=c;came[k]=[x,y];open.push([c+h(nx,ny),nx,ny])}}}
 return[]}
const PA=astar([1,1],[28,14]);
const newMap=()=>Array.from({length:GH},()=>Array(GW).fill(0));
function scan(m,px,py){for(let a=0;a<24;a++){const th=a/24*6.2832;for(let d=0;d<=7;d+=.25){const cx=Math.floor(px+Math.cos(th)*d),cy=Math.floor(py+Math.sin(th)*d);if(cx<0||cy<0||cx>=GW||cy>=GH)break;if(blk[cy][cx]){m[cy][cx]=2;break}if(m[cy][cx]!=2)m[cy][cx]=1}}}
function drawMap(x,m){x.clearRect(0,0,600,320);for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const v=m[j][i];if(v){x.globalAlpha=v==2?1:.22;x.fillStyle=v==2?col('--tx'):col('--ac');x.fillRect(i*CS,j*CS,CS,CS)}}x.globalAlpha=1}

/* ---------- содержимое ---------- */
const ST=[
{t:'Подготовка данных и ПО',d:'Сбор данных с камер и датчиков, применение датасета, очистка и нормализация.',k:['Сбор данных с камер и датчиков','Применение датасета','Удаление шума (фильтрация)','Нормализация данных','Обработка изображений (OpenCV)','Коррекция данных GPS','Коррекция ошибок']},
{t:'Генерация траектории',d:'Расчёт наиболее эффективного маршрута БПЛА: круговая, «восьмёрка» или произвольная траектория на выбранном участке.',k:['Применение алгоритмов ИИ','Учёт препятствий','Определение оптимального пути']},
{t:'Управление полётом',d:'Управление движением дрона в реальном времени.',k:['Применение алгоритмов PID или PPO','Коррекция скорости и направления','Маневрирование']},
{t:'Обнаружение объектов',d:'Обнаружение объектов и препятствий по кадрам БПЛА и данным ГИС.',k:['Распознавание объектов с помощью камеры','Применение нейронной сети YOLOv8','Определение координат объекта','Обнаружение препятствий']},
{t:'Создание карты',d:'Картирование окружающей среды по мере полёта.',k:['Применение алгоритма SLAM','Создание 2D/3D карты','Вставка объектов на карту (дрон с траекторией)']},
{t:'Изменение координат',d:'Преобразование GPS-координат в локальную систему.',k:['Геодезические расчёты','Преобразование координат','Повышение точности']},
{t:'Принятие решений',d:'Интеллектуальное принятие решений по блок-схеме: анализ CNN–LSTM–EKF, адаптивное управление и обратная связь.',k:['Выполнение программы по блок-схеме (рис. 2)','Анализ принятого решения']}];
const TT={ndvi:'Расчёт NDVI',res:'Результаты'};ST.forEach((s,i)=>TT['s'+(i+1)]=s.t);
const ORD=['home','s1','s2','s3','s4','s5','s6','s7','ndvi','res'];
const hd=n=>{const s=ST[n-1];return `<h2>Этап ${n}. ${s.t}</h2><p class="mu">${s.d}</p><div class="card"><h3>Выполняемые задачи</h3><ul>${s.k.map(x=>`<li>${x}</li>`).join('')}</ul></div>`};
const AI=[['Машинное обучение (ML)','Линейная/полиномиальная регрессия, SVM','Прогнозирование параметров и трендов','Результаты'],
['Глубокое обучение (DL)','Свёрточные и рекуррентные сети (CNN–LSTM)','Анализ временных рядов, прогноз природных процессов','4, 7'],
['Деревья решений','Decision Tree, Random Forest, XGBoost','Классификация данных ДЗЗ и ГИС, выбор оптимальных параметров','NDVI'],
['Нечёткая логика (Fuzzy Logic)','Нечёткие правила и системы Мамдани','Оценка неопределённости, моделирование экспертных решений','7'],
['Гибридные подходы (AI + EKF)','CNN–LSTM + расширенный фильтр Калмана (EKF)','Повышение устойчивости и точности моделей','1, 7']];

const P={};
P.home={h:`<h2>Система интеллектуального управления БПЛА</h2><p class="mu">Семь этапов от подготовки данных до принятия решений. Каждая кнопка ведёт на страницу этапа с описанием работы и демонстрацией.</p>
<div class="grid">${ST.map((s,i)=>`<a class="card" href="#s${i+1}"><b>Этап ${i+1}</b><br>${s.t}</a>`).join('')}<a class="card" href="#ndvi"><b>NDVI</b><br>Расчёт NDVI и решение о съёмке</a><a class="card" href="#res"><b>Итоги</b><br>Прогноз, обучение, карта, полёт</a></div>
<div class="card"><h3>Входные данные</h3><div class="tw"><table><tr><th>Источник</th><th>Что поступает</th><th>Особенности применения</th></tr>
<tr><td>Поток с камеры</td><td>Кадры RGB и каналы NIR/Red, 640×480…1920×1080, 30 кадр/с</td><td>Шум и смаз при движении, меняющийся свет. Для обучения YOLOv8 — датасет VisDrone (съёмка с БПЛА, мелкие объекты) и аугментации.</td></tr>
<tr><td>Карта, положение, цель</td><td>Растровая/векторная карта (OSM, слои ГИС), стартовая точка и цель в WGS84</td><td>Карта переводится в сетку занятости, по которой планировщик строит путь.</td></tr>
<tr><td>Данные GPS</td><td>NMEA/MAVLink: широта, долгота, высота, 1–10 Гц</td><td>Погрешность 2–5 м, скачки у зданий. Фильтруются (Калман/EKF) и переводятся в локальную систему на этапе 6.</td></tr></table></div></div>
<div class="card"><h3>Методы ИИ в проекте</h3><div class="tw"><table><tr><th>№</th><th>Класс методов</th><th>Алгоритм</th><th>Назначение</th><th>Этап</th></tr>${AI.map((r,i)=>`<tr><td>${i+1}</td>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div></div>`};

P.s1={h:hd(1)+`<div class="card"><h3>Фильтрация шума GPS (фильтр Калмана)</h3><div class="row">${sl('sg','Шум GPS, м',0,40,1,15)}${sl('kq','Ускорение цели q',0.01,10,0.01,1)}</div><canvas id="c1" width="600" height="320"></canvas><p id="o1" class="mu"></p></div><div class="card"><h3>Нормализация</h3><p>Min–max: x′ = (x − x<sub>min</sub>) / (x<sub>max</sub> − x<sub>min</sub>). Для изображений пиксели 0–255 приводятся к 0–1, затем кадр масштабируется под вход сети (640×640 для YOLOv8).</p></div>`,
i(){const x=cv('c1',600,320);
 const kf=(zs,q,R)=>{let p=zs[0],v=0,a0=1e3,a1=0,a2=1e3;return zs.map(z=>{p+=v;const a=a0+2*a1+a2+q/4,b=a1+a2+q/2,d=a2+q,S=a+R,k0=a/S,k1=b/S,y=z-p;p+=k0*y;v+=k1*y;a0=(1-k0)*a;a1=(1-k0)*b;a2=d-k1*b;return p})};
 bind(['sg','kq'],()=>{const sg=+$('#sg').value,q=+$('#kq').value,r=rnd(7),g=()=>Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.2832*r());
  const T=[],Z=[];for(let i=0;i<100;i++){const a=i/100*5.5,t=[300+230*Math.cos(a),160+120*Math.sin(a)];T.push(t);Z.push([t[0]+sg*g(),t[1]+sg*g()])}
  const fx=kf(Z.map(z=>z[0]),q,sg*sg+1e-3),fy=kf(Z.map(z=>z[1]),q,sg*sg+1e-3),F=fx.map((v,i)=>[v,fy[i]]);
  const rm=A=>Math.sqrt(A.reduce((s,p,i)=>s+(p[0]-T[i][0])**2+(p[1]-T[i][1])**2,0)/A.length);
  x.clearRect(0,0,600,320);pl(x,T,col('--mu'),1.5);Z.forEach(z=>dot(x,z[0],z[1],col('--bl'),2.2));pl(x,F,col('--ac'),2.5);
  $('#o1').innerHTML=`Серая линия — истинный путь, синие точки — GPS с шумом, зелёная линия — после фильтра.<br>Ошибка (RMSE): без фильтра <b>${rm(Z).toFixed(1)} м</b>, после фильтра <b>${rm(F).toFixed(1)} м</b>.`})}};

P.s2={h:hd(2)+`<div class="card"><div class="row"><label>Тип траектории<br><select id="tt"><option value="a">Произвольная (A*)</option><option value="c">Круговая</option><option value="e">Восьмёрка</option></select></label></div><p class="mu">Участок 150×80 м, 1 ячейка = 5 м. Серые клетки — здания и деревья.</p><canvas id="c2" width="600" height="320"></canvas><p id="o2"></p></div>`,
i(){const x=cv('c2',600,320),f=()=>{x.clearRect(0,0,600,320);world(x);const t=$('#tt').value;let pts,msg;
 if(t=='a'){pts=PA.map(q=>[q[0]+.5,q[1]+.5]);const L=PA.reduce((s,q,i)=>i?s+Math.hypot(q[0]-PA[i-1][0],q[1]-PA[i-1][1]):0,0)*5;msg=`A*: ${PA.length} узлов, длина ${L.toFixed(0)} м (по прямой ${(Math.hypot(27,13)*5).toFixed(0)} м), столкновений 0.`}
 else{pts=[];for(let i=0;i<=120;i++){const a=i/120*6.2832;pts.push(t=='c'?[15+8*Math.cos(a),8+6*Math.sin(a)]:[15+12*Math.sin(a),8+5*Math.sin(2*a)])}
  const bad=pts.filter(q=>blk[Math.floor(q[1])]?.[Math.floor(q[0])]).length;msg=`${t=='c'?'Круг':'Восьмёрка'}: точек внутри препятствий ${bad} из ${pts.length}. ${bad?'Траектория недопустима, нужна коррекция (A*).':'Маршрут свободен.'}`}
 pl(x,pts.map(q=>[q[0]*CS,q[1]*CS]),col('--ac'),3);dot(x,1.5*CS,1.5*CS,col('--bl'),6);dot(x,28.5*CS,14.5*CS,col('--wa'),6);$('#o2').textContent=msg};
 $('#tt').onchange=f;f()}};

P.s3={h:hd(3)+`<div class="card"><h3>PID-регулятор: отработка шага 1 м</h3><div class="row">${sl('kp','Kp',0,20,.1,6)}${sl('ki','Ki',0,5,.1,.5)}${sl('kd','Kd',0,10,.1,4)}</div><canvas id="c3" width="600" height="260"></canvas><p id="o3"></p><p class="mu">Пунктир — заданное положение, зелёная кривая — отклик дрона. PPO (обучение с подкреплением) заменяет ручную настройку коэффициентов: агент учится в симуляторе (Gym, AirSim) выбирать управление по состоянию дрона.</p></div>`,
i(){const x=cv('c3',600,260);bind(['kp','ki','kd'],()=>{const kp=+$('#kp').value,ki=+$('#ki').value,kd=+$('#kd').value,dt=.02;let p=0,v=0,I=0,pe=1;const ys=[];
 for(let i=0;i<500;i++){const e=1-p;I+=e*dt;let u=kp*e+ki*I+kd*(e-pe)/dt;pe=e;u=Math.max(-30,Math.min(30,u));v+=(u-.6*v)*dt;p+=v*dt;ys.push(p)}
 x.clearRect(0,0,600,260);const Y=q=>230-q*130;x.strokeStyle=col('--mu');x.setLineDash([5,4]);x.beginPath();x.moveTo(0,Y(1));x.lineTo(600,Y(1));x.stroke();x.setLineDash([]);
 pl(x,ys.map((q,i)=>[i*1.2,Math.max(5,Math.min(255,Y(q)))]),col('--ac'),2.5);
 const mx=Math.max(...ys);let ts=0;ys.forEach((q,i)=>{if(Math.abs(q-1)>.05)ts=i});
 $('#o3').textContent=`Перерегулирование: ${Math.max(0,(mx-1)*100).toFixed(1)} %. Время установления (±5 %): ${ts>=499?'не установилось':(ts*dt).toFixed(1)+' с'}.`})}};

P.s4={h:hd(4)+`<div class="card"><div class="row"><button class="btn" id="nf">Новый кадр</button></div><p class="mu">Демонстрация: детекции имитируют вывод YOLOv8, координаты считаются по модели камеры, смотрящей вниз (0,1 м на пиксель).</p><canvas id="c4" width="600" height="360"></canvas><div class="tw"><table id="t4"></table></div></div><div class="card"><h3>Код для реального запуска</h3><pre>from ultralytics import YOLO
model = YOLO("yolov8n.pt")  # или best.pt после дообучения на VisDrone
res = model(frame, conf=0.4)[0]
for b in res.boxes:
    x1, y1, x2, y2 = b.xyxy[0].tolist()
    print(model.names[int(b.cls)], float(b.conf), (x1+x2)/2, (y1+y2)/2)</pre></div>`,
i(){const x=cv('c4',600,360),W=600,H=360,mpp=.1,la0=51.1694,lo0=71.4491,cls=[['автомобиль',36,18,'#c0392b'],['дерево',28,28,'#2d5a27'],['человек',10,10,'#f1c40f'],['здание',70,50,'#8e8e93']];
 const f=()=>{const r=rnd(Math.floor(Math.random()*1e6)+1);x.fillStyle='#6d9b52';x.fillRect(0,0,W,H);x.fillStyle='#7aa860';for(let i=0;i<W;i+=40)x.fillRect(i,0,20,H);
  const rows=[];for(let k=0;k<8;k++){const c=cls[Math.floor(r()*4)],px=60+r()*480,py=40+r()*280,w=c[1],h=c[2];x.fillStyle=c[3];
   if(c[0]=='дерево'||c[0]=='человек'){x.beginPath();x.arc(px,py,w/2,0,7);x.fill()}else x.fillRect(px-w/2,py-h/2,w,h);
   const cf=.55+r()*.43;x.strokeStyle='#ffe600';x.lineWidth=2;x.strokeRect(px-w/2-3,py-h/2-3,w+6,h+6);x.fillStyle='#ffe600';x.font='12px sans-serif';x.fillText(c[0]+' '+cf.toFixed(2),px-w/2-3,py-h/2-7);
   const la=la0-(py-H/2)*mpp/111320,lo=lo0+(px-W/2)*mpp/(111320*Math.cos(la0*Math.PI/180));
   rows.push(`<tr><td>${c[0]}</td><td>${cf.toFixed(2)}</td><td>${px.toFixed(0)}, ${py.toFixed(0)}</td><td>${la.toFixed(6)}, ${lo.toFixed(6)}</td></tr>`)}
  $('#t4').innerHTML='<tr><th>Класс</th><th>Уверенность</th><th>Пиксели (x, y)</th><th>GPS (широта, долгота)</th></tr>'+rows.join('')};
 $('#nf').onclick=f;f()}};

P.s5={h:hd(5)+`<div class="card"><div class="row"><button class="btn g" id="rs">Перезапуск</button></div><canvas id="c5" width="600" height="320"></canvas><p id="o5" class="mu"></p><p class="mu">Дрон летит по маршруту A* и сканирует окружение 24 лучами (дальность 35 м). Светлые клетки — свободно, тёмные — препятствие. Это упрощённое картирование по известной позе; в полном SLAM поза оценивается одновременно с картой (EKF-SLAM, ORB-SLAM). 3D-карта строится из облака точек (Open3D).</p></div>`,
i(){const x=cv('c5',600,320);let m,k;
 const st=()=>{const q=PA[k];scan(m,q[0]+.5,q[1]+.5);drawMap(x,m);pl(x,PA.slice(0,k+1).map(a=>[(a[0]+.5)*CS,(a[1]+.5)*CS]),col('--bl'),2);dot(x,(q[0]+.5)*CS,(q[1]+.5)*CS,col('--wa'),6);
  let c=0;m.forEach(r=>r.forEach(v=>c+=v>0));$('#o5').textContent=`Позиция ${k+1} из ${PA.length}, исследовано ${(c/GW/GH*100).toFixed(0)} % карты.`;if(k<PA.length-1)k++};
 const run=()=>{stop();m=newMap();k=0;ev(st,90)};$('#rs').onclick=run;run()}};

const enu=(lat,lon,h,la0,lo0,h0)=>{const a=6378137,f=1/298.257223563,e2=f*(2-f),r=Math.PI/180;
 const E=(la,lo,h)=>{const N=a/Math.sqrt(1-e2*Math.sin(la*r)**2);return[(N+h)*Math.cos(la*r)*Math.cos(lo*r),(N+h)*Math.cos(la*r)*Math.sin(lo*r),(N*(1-e2)+h)*Math.sin(la*r)]};
 const p=E(lat,lon,h),o=E(la0,lo0,h0),d=p.map((v,i)=>v-o[i]),sl=Math.sin(la0*r),cl=Math.cos(la0*r),so=Math.sin(lo0*r),co=Math.cos(lo0*r);
 return[-so*d[0]+co*d[1],-sl*co*d[0]-sl*so*d[1]+cl*d[2],cl*co*d[0]+cl*so*d[1]+sl*d[2]]};
const ni=(id,l,v)=>`<label>${l}<br><input type="number" id="${id}" value="${v}" step="any" style="width:130px"></label>`;
P.s6={h:hd(6)+`<div class="card"><h3>WGS84 → локальная система ENU</h3><p class="mu">Начало координат — точка старта дрона. Геодезический путь: широта/долгота/высота → геоцентрические XYZ (ECEF) → поворот в систему «восток–север–вверх».</p><div class="row" id="a6">${ni('la0','Широта старта',51.1694)}${ni('lo0','Долгота старта',71.4491)}${ni('la','Широта точки',51.1712)}${ni('lo','Долгота точки',71.4533)}${ni('hh','Высота точки, м',60)}</div><pre id="o6"></pre></div>`,
i(){const f=()=>{const v=id=>+$('#'+id).value,[e,n,u]=enu(v('la'),v('lo'),v('hh'),v('la0'),v('lo0'),0),R=6371000,d=Math.PI/180,e2=(v('lo')-v('lo0'))*d*R*Math.cos(v('la0')*d),n2=(v('la')-v('la0'))*d*R;
 $('#o6').textContent=`Точное преобразование (WGS84 → ECEF → ENU)\n  E = ${e.toFixed(2)} м, N = ${n.toFixed(2)} м, U = ${u.toFixed(2)} м\n  Расстояние в плоскости: ${Math.hypot(e,n).toFixed(2)} м\n\nПриближение «плоская Земля»\n  E = ${e2.toFixed(2)} м, N = ${n2.toFixed(2)} м\n  Расхождение с точным: ${Math.hypot(e-e2,n-n2).toFixed(3)} м`};
 document.querySelectorAll('#a6 input').forEach(a=>a.oninput=f);f()}};

P.s7={h:hd(7)+`<div class="card"><h3>Блок-схема (рис. 2)</h3><ol><li>Запуск потока, получение кадра; кадра нет — переход к следующему (continue).</li><li>Обнаружение объектов (detect) и проверка аномалий текстуры.</li><li>Получение координат GPS (get_gps_coords).</li><li>Объекты или аномалии найдены? Нет — следующий кадр. Да — формирование сообщения.</li><li>Объекта нет — отправка сообщения. Объект есть — управление объектом.</li><li>Анализ CNN–LSTM–EKF, решение на основе ИИ, адаптивное управление БПЛА, обратная связь.</li></ol><div class="row"><button class="btn" id="rn">Запустить 12 кадров</button></div><p class="mu">Кадры и детекции имитированы, логика ветвления соответствует схеме.</p><pre id="lg">Нажмите «Запустить 12 кадров».</pre></div>`,
i(){$('#rn').onclick=()=>{const r=rnd(Math.floor(Math.random()*9999)+1),o=[];let la=51.1694,lo=71.4491;
 for(let k=1;k<=12;k++){la+=r()*2e-5;lo+=r()*3e-5;const g=`GPS ${la.toFixed(5)}, ${lo.toFixed(5)}`;
  if(r()<.12){o.push(`#${k} кадр не получен → continue`);continue}
  const n=Math.floor(r()*3),an=r()<.3;if(!n&&!an){o.push(`#${k} ${g} | чисто → следующий кадр`);continue}
  o.push(n?`#${k} ${g} | объектов: ${n}, conf≈${(.6+r()*.38).toFixed(2)} → управление объектом, коррекция курса (PID)`:`#${k} ${g} | аномалия текстуры → сообщение оператору, полёт продолжается`)}
 $('#lg').textContent=o.join('\n')}}};

const fld=seed=>{const r=rnd(seed),B=[0,1,2].map(()=>[8+r()*32,8+r()*32,4+r()*6]),a=[];
 for(let j=0;j<48;j++)for(let i=0;i<48;i++){let s=0;B.forEach(b=>s+=Math.exp(-((i-b[0])**2+(j-b[1])**2)/(2*b[2]**2)));s=Math.min(1,s);
  const nir=.5-.2*s+(r()-.5)*.04,red=.08+.07*s+(r()-.5)*.015;a.push((nir-red)/(nir+red))}return a};
P.ndvi={h:`<h2>Расчёт NDVI и принятие решений</h2><p class="mu">NDVI = (NIR − Red) / (NIR + Red). Если NDVI ниже порога и есть признаки стресса, дрон делает снимок.</p>
<div class="card"><div class="row">${sl('th','Порог NDVI',0.2,0.7,0.01,0.5)}<button class="btn g" id="nn">Новое поле</button></div><div class="grid"><div><h3>NDVI (0,1 светлый → 0,6 тёмный)</h3><canvas id="n1" width="240" height="240"></canvas></div><div><h3>Классификация: красный — стресс</h3><canvas id="n2" width="240" height="240"></canvas></div></div><p id="no"></p>
<p class="mu">Поле синтетическое: здоровая растительность даёт NDVI около 0,7, зоны фитостресса — около 0,3. В боевом режиме классификатор (Random Forest, XGBoost или CNN) получает NDVI, текстуру и другие индексы, здесь решение принимается по порогу, как на схеме.</p></div>`,
i(){const a=cv('n1',240,240),b=cv('n2',240,240);let F=fld(Math.floor(Math.random()*999)+1);
 const draw=()=>{const th=+$('#th').value,I=a.createImageData(240,240),J=b.createImageData(240,240);let c=0,sx=0,sy=0,m=0;
  F.forEach((v,k)=>{const i=k%48,j=(k/48)|0,g=255*(1-Math.max(0,Math.min(1,(v-.1)/.5))),s=v<th;m+=v;if(s){c++;sx+=i;sy+=j}
   for(let dy=0;dy<5;dy++)for(let dx=0;dx<5;dx++){const o=((j*5+dy)*240+i*5+dx)*4;I.data.set([g,g,g,255],o);J.data.set(s?[217,83,79,255]:[58,157,111,255],o)}});
  a.putImageData(I,0,0);b.putImageData(J,0,0);const sh=c/F.length;
  $('#no').innerHTML=`Средний NDVI: <b>${(m/F.length).toFixed(2)}</b>. Ниже порога: <b>${(sh*100).toFixed(1)} %</b>${c?`, центр зоны (${(sx/c).toFixed(0)}, ${(sy/c).toFixed(0)}).`:'.'}<br>Решение: <b>${sh>.05?'да, есть признаки стресса → сделать снимок и передать координаты зоны':'нет, продолжить маршрут'}</b>`};
 $('#nn').onclick=()=>{F=fld(Math.floor(Math.random()*999)+1);draw()};bind(['th'],draw)}};

P.res={h:`<h2>Результаты</h2>
<div class="card"><h3>Прогнозирование: NDVI поля по неделям</h3><canvas id="r1" width="600" height="240"></canvas><p id="p1" class="mu"></p></div>
<div class="card"><h3>Результаты обучения: ошибка MSE по эпохам (log₁₀)</h3><canvas id="r2" width="600" height="240"></canvas><p id="p2" class="mu"></p></div>
<div class="card"><h3>Завершённая карта</h3><canvas id="r3" width="600" height="320"></canvas></div>
<div class="card"><h3>Движение дрона</h3><canvas id="r4" width="600" height="320"></canvas><div class="row"><button class="btn g" id="pl">Повторить</button></div></div>`,
i(){const ts=[...Array(12).keys()],rn=rnd(3),ys=ts.map(t=>.3+.07*t-.004*t*t+(rn()-.5)*.03),u=t=>(t-5.5)/3.5,ft=t=>[1,u(t),u(t)**2];
 let w=[0,0,0];const ls=[],pr=t=>{const f=ft(t);return f[0]*w[0]+f[1]*w[1]+f[2]*w[2]};
 for(let e=0;e<1500;e++){const g=[0,0,0];let s=0;ts.forEach((t,i)=>{const f=ft(t),er=pr(t)-ys[i];s+=er*er;f.forEach((v,j)=>g[j]+=2*er*v/12)});w=w.map((v,j)=>v-.05*g[j]);ls.push(s/12)}
 const mean=ys.reduce((a,b)=>a+b)/12,sst=ys.reduce((s,y)=>s+(y-mean)**2,0),ssr=ts.reduce((s,t,i)=>s+(pr(t)-ys[i])**2,0);
 const x1=cv('r1',600,240),X=t=>10+t*38,Y=v=>220-(v-.2)*340;
 pl(x1,[...Array(61).keys()].filter(i=>i<=44).map(i=>[X(i/4),Y(pr(i/4))]),col('--ac'),2.5);
 x1.setLineDash([6,5]);pl(x1,[...Array(61).keys()].filter(i=>i>=44).map(i=>[X(i/4),Y(pr(i/4))]),col('--wa'),2.5);x1.setLineDash([]);
 ts.forEach((t,i)=>dot(x1,X(t),Y(ys[i]),col('--bl'),3.5));
 $('#p1').textContent=`Точки — измерения (недели 0–11), зелёная линия — полиномиальная регрессия 2-й степени, оранжевый пунктир — прогноз до недели 15: NDVI ≈ ${pr(15).toFixed(2)}. R² = ${(1-ssr/sst).toFixed(3)}.`;
 const x2=cv('r2',600,240);pl(x2,ls.filter((_,i)=>i%10==0).map((l,i)=>[10+i*580/150,Math.max(5,Math.min(235,230-(Math.log10(l)+5)*45))]),col('--ac'),2.5);
 $('#p2').textContent=`Модель обучена в браузере градиентным спуском: 1500 эпох, MSE ${ls[0].toFixed(4)} → ${ls[1499].toExponential(1)}. Нейросети CNN–LSTM и YOLOv8 обучаются в Python (PyTorch).`;
 const x3=cv('r3',600,320),m=newMap();PA.forEach(q=>scan(m,q[0]+.5,q[1]+.5));drawMap(x3,m);const L=PA.map(q=>[(q[0]+.5)*CS,(q[1]+.5)*CS]);pl(x3,L,col('--bl'),2);dot(x3,L[0][0],L[0][1],col('--bl'),5);dot(x3,L[L.length-1][0],L[L.length-1][1],col('--wa'),5);
 const x4=cv('r4',600,320);let t=0;
 const fr=()=>{x4.clearRect(0,0,600,320);world(x4);pl(x4,L,col('--bd'),2);const i=Math.floor(t),a=t-i,p=L[i],q=L[Math.min(i+1,L.length-1)],px=p[0]+(q[0]-p[0])*a,py=p[1]+(q[1]-p[1])*a;
  pl(x4,L.slice(0,i+1).concat([[px,py]]),col('--ac'),3);[[-7,-7],[7,-7],[-7,7],[7,7]].forEach(d=>dot(x4,px+d[0],py+d[1],col('--tx'),3));dot(x4,px,py,col('--wa'),5);if(t<L.length-1.1)t+=.1};
 $('#pl').onclick=()=>{t=0};ev(fr,35)}};

function go(){stop();const id=(location.hash||'#home').slice(1),ok=!!P[id],k=ok?ORD.indexOf(id):0,p=P[ok?id:'home'];
 $('#nav').innerHTML=ORD.map((x,i)=>`<a href="#${x}" class="${i==k?'on':''}">${x=='home'?'Старт':x=='ndvi'?'NDVI':x=='res'?'Итоги':x.slice(1)}</a>`).join('');
 const pv=ORD[k-1],nx=ORD[k+1];
 $('#app').innerHTML=p.h+`<div class="row">${pv?`<a class="btn g" href="#${pv}">← Назад</a>`:''}${nx?`<a class="btn" href="#${nx}">${k?'Далее: '+TT[nx]:'Начать: '+TT[nx]} →</a>`:''}</div>`;
 p.i&&p.i();scrollTo(0,0)}
addEventListener('hashchange',go);go();
</script>
</body>
